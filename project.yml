name: DramaApp
options:
  bundleIdPrefix: com.rongrong
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

targets:
  DramaApp:
    type: application
    platform: iOS
    sources:
      - path: DramaApp
    info:
      path: DramaApp/Info.plist
      properties:
        CFBundleDisplayName: 果壳短剧
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true   # 允许 http 局域网访问后台
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rongrong.guoke
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ENABLE_BITCODE: NO
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
