name: Build IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 生成 Xcode 工程（XcodeGen）
        run: |
          brew install xcodegen
          xcodegen generate

      - name: 编译（不签名）
        run: |
          xcodebuild -project DramaApp.xcodeproj -scheme DramaApp \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" build

      - name: 打包 IPA
        run: |
          mkdir -p Payload
          cp -R "build/Build/Products/Release-iphoneos/DramaApp.app" Payload/
          zip -qry DramaApp.ipa Payload
          ls -lh DramaApp.ipa

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: DramaApp-ipa
          path: DramaApp.ipa
